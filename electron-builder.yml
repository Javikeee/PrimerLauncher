appId: 'es.keeestudios.launcher'
productName: 'Keee Launcher'
artifactName: 'Keee-Launcher-setup-${version}.${ext}'

copyright: 'Copyright © 2026 Keee Studio. Based on Helios Launcher © Daniel Scalzi'

asar: true
compression: 'maximum'

files:
  - '**/*'
  - '!{dist,distribution,modpacks,tools,.publish,.gitignore,.vscode,docs,dev-app-update.yml,.nvmrc,eslint.config.mjs}'
  # electron-builder drops examples/ folders by default, but skinview3d imports
  # its camera controls from three/examples.
  - from: 'node_modules/three/examples/jsm'
    to: 'node_modules/three/examples/jsm'
    filter: ['**/*']

extraResources:
  - 'libraries'

# Windows Configuration
win: 
  target: 
    - target: 'nsis'
      arch: 'x64'

# Windows Installer Configuration
nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true

# macOS Configuration
mac:
  target:
    - target: 'dmg'
      arch:
        - 'x64'
        - 'arm64'
  artifactName: 'Keee-Launcher-setup-${version}-${arch}.${ext}'
  category: 'public.app-category.games'

# Linux Configuration
linux: 
  target: 'AppImage'
  maintainer: 'Keee Studio'
  vendor: 'Keee Studio'
  synopsis: 'Modded Minecraft Launcher'
  description: 'Custom launcher which allows users to join modded servers. All mods, configurations, and updates are handled automatically.'
  category: 'Game'


directories:
  buildResources: 'build'
  output: 'dist'
# Releases go to a public repository so electron-updater can read them
# (the source code repository is private).
publish:
  provider: 'github'
  owner: 'Javikeee'
  repo: 'keee-launcher'
  releaseType: 'release'
